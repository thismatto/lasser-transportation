<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write a Review — Lasser Transportation LLC</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0771/9652/5726/files/bus-icon.png-modified.png?v=1783142462" />

  <meta name="description" content="Share your experience with Lasser Transportation LLC. We value your feedback to help us continue providing the best transportation in South Florida." />
  <meta property="og:title" content="Write a Review | Lasser Transportation LLC" />
  <meta property="og:description" content="Share your experience with Lasser Transportation LLC. We value your feedback!" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://lassertransportation.com/WriteReview.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  
  <!-- CACHE BUSTER -->
  <link rel="stylesheet" href="css/style.css?v=25" />
</head>
<body>
  
  <!-- THE HEADER WILL BE INJECTED RIGHT HERE BY MAIN.JS -->
  <div id="header-placeholder"></div>

  <!-- HERO SECTION -->
  <section class="hero" style="min-height: 40vh;">
    <!-- Using a slightly different positioning or you can change the image URL for variety -->
    <div class="hero-bg" style="background-image:url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=1600&q=80'); background-position: center 60%;"></div>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <span class="eyebrow">Your Feedback</span>
      <h1>Write a Review.</h1>
      <p>We'd love to hear about your experience riding with us.</p>
    </div>
  </section>

  <!-- REVIEW FORM SECTION -->
  <section class="section">
    <div class="container">
      
      <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
        <div style="text-align: center; margin-bottom: 30px;">
          <h2 style="margin-bottom: 10px; color: #0f172a;">Rate your ride</h2>
          <p style="color: #475569;">Your reviews help us grow and serve South Florida better.</p>
        </div>

        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you for your review!');">
          
          <!-- Name Field -->
          <div style="margin-bottom: 20px;">
            <label for="reviewer-name" style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Full Name</label>
            <input type="text" id="reviewer-name" name="name" required placeholder="John Doe" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 1rem;" />
          </div>

          <!-- Email Field -->
          <div style="margin-bottom: 20px;">
            <label for="reviewer-email" style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Email Address</label>
            <input type="email" id="reviewer-email" name="email" required placeholder="john@example.com" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 1rem;" />
          </div>

          <!-- Rating Field -->
          <div style="margin-bottom: 20px;">
            <label for="reviewer-rating" style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Rating</label>
            <select id="reviewer-rating" name="rating" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 1rem; color: #475569; background-color: #fff;">
              <option value="5">★★★★★ - Excellent</option>
              <option value="4">★★★★☆ - Very Good</option>
              <option value="3">★★★☆☆ - Average</option>
              <option value="2">★★☆☆☆ - Poor</option>
              <option value="1">★☆☆☆☆ - Terrible</option>
            </select>
          </div>

          <!-- Review Message Field -->
          <div style="margin-bottom: 30px;">
            <label for="reviewer-message" style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Your Review</label>
            <textarea id="reviewer-message" name="message" rows="5" required placeholder="Tell us about your trip..." style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 1rem; resize: vertical;"></textarea>
          </div>

          <!-- Submit Button -->
          <div style="text-align: center;">
            <button type="submit" class="btn btn-primary" style="width: 100%; cursor: pointer; border: none; font-size: 1.1rem; padding: 14px;">Submit Review</button>
          </div>

        </form>
      </div>

    </div>
  </section>

  <!-- CTA BANNER (Optional: Kept it for consistency) -->
  <section class="section section-alt">
    <div class="container text-center" style="text-align: center; max-width: 800px;">
      <h2 style="font-size: 2.5rem; margin-bottom: 20px;">Need another ride?</h2>
      <p style="font-size: 1.1rem; margin-bottom: 30px;">
        Ready for your next trip? Reach out to our team today to book your next comfortable and safe journey.
      </p>
      <a href="contact.html" class="btn btn-primary">Contact Us</a>
    </div>
  </section>

  <!-- THE FOOTER WILL BE INJECTED RIGHT HERE BY MAIN.JS -->
  <div id="footer-placeholder"></div>

  <script src="js/main.js"></script>
</body>
</html>
